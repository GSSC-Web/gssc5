#:schema https://mise.jdx.dev/schema/mise.json
# GSSC5 web monorepo. Tasks in apps/* are addressable as //apps/<name>:<task>.

min_version = "2026.10.0"
monorepo_root = true

[monorepo]
config_roots = ["apps/*"]
lockfile = true

[tools]
bun = "1.3"
node = "22"

[tasks.serve]
description = "Start a local development instance"
depends = ["//apps/backend:serve", "//apps/public:serve", "//apps/members:serve"]

[tasks.build]
description = "Build the frontend and backend for production"
depends = ["//apps/backend:build", "//apps/public:build", "//apps/members:build"]

[tasks.test]
description = "Run the backend and frontend tests"
depends = ["//apps/backend:test", "//apps/public:test", "//apps/members:test"]
