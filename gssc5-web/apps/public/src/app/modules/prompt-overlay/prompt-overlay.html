@if (promptOverlay.current(); as prompt) {
  <!-- @relation(GSSC-PLLR-107, GSSC-PLLR-108, scope=range_start, role=Implementation) -->
  <!-- @relation(GSSC-PLLR-109, scope=range_start, role=Implementation) -->
  <div
    class="gssc-prompt-overlay fixed inset-0 z-50 flex items-center justify-center bg-gssc-gray/25 font-sans text-gssc-dark-green"
    role="presentation"
  >
    <!-- @relation(GSSC-PLLR-109, scope=range_end, role=Implementation) -->
    <div
      class="gssc-prompt-overlay__panel relative flex h-dvh w-dvw max-h-dvh max-w-dvw flex-col overflow-auto border border-gssc-dark-green bg-gssc-white text-gssc-dark-green sm:h-auto sm:max-h-[75dvh] sm:w-[min(100%,75vw)] sm:max-w-[75vw]"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="prompt.title || null"
    >
      <!-- @relation(GSSC-PLLR-111, GSSC-PLLR-112, GSSC-PLLR-134, GSSC-PLLR-135, GSSC-PLLR-136, scope=range_start, role=Implementation) -->
      <div
        class="gssc-prompt-overlay__header sticky top-0 z-10 flex items-start justify-between gap-3 border-b border-gssc-gray bg-gssc-white px-4 py-3"
      >
        <h2
          class="gssc-prompt-form__title m-0 min-w-0 flex-1 font-sans text-lg font-medium text-gssc-dark-green"
        >
          {{ prompt.title }}
        </h2>
        <button
          type="button"
          class="gssc-prompt-overlay__dismiss inline-flex size-8 shrink-0 cursor-pointer items-center justify-center border-0 bg-transparent p-0 font-sans text-gssc-dark-green hover:text-gssc-gray"
          aria-label="Close"
          (click)="dismiss()"
        >
          <i class="nf nf-md-close text-base leading-none" aria-hidden="true"></i>
        </button>
      </div>
      <!-- @relation(GSSC-PLLR-111, GSSC-PLLR-112, GSSC-PLLR-134, GSSC-PLLR-135, GSSC-PLLR-136, scope=range_end, role=Implementation) -->

      <div class="gssc-prompt-overlay__contents px-4 pb-4 pt-3">
        <gssc-prompt-form
          [fields]="prompt.fields"
          (submitted)="onSubmitted($event)"
          (cancelled)="dismiss()"
        />
      </div>
    </div>
  </div>
  <!-- @relation(GSSC-PLLR-107, GSSC-PLLR-108, scope=range_end, role=Implementation) -->
}
