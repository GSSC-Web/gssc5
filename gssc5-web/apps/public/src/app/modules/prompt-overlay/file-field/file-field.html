<!-- @relation(GSSC-PLLR-129, GSSC-PLLR-130, scope=range_start, role=Implementation) -->
<div
  class="gssc-prompt-file-field relative mt-2 flex min-w-0 flex-col rounded-md border px-1 py-2 font-sans"
  [class.border-gssc-dark-green]="!invalid()"
  [class.border-red-500]="invalid()"
  [class.bg-gssc-white]="enabled() && !invalid()"
  [class.bg-gssc-gray]="!enabled()"
  [class.bg-red-50]="invalid()"
>
  <label
    class="gssc-prompt-file-field__label absolute -top-2 start-2 bg-inherit px-1 text-xs font-extralight italic"
    [class.text-gssc-dark-green]="!invalid()"
    [class.text-red-500]="invalid()"
    [attr.for]="controlId()"
  >
    {{ label() }}@if (required()) {
      <span aria-hidden="true">&nbsp;*</span>
    }
  </label>
  <input
    class="gssc-prompt-file-field__control w-full border-0 bg-transparent font-sans text-sm outline-none"
    [class.text-gssc-dark-green]="!invalid()"
    [class.text-red-500]="invalid()"
    type="file"
    [id]="controlId()"
    [disabled]="!enabled()"
    [attr.accept]="accept() || null"
    [attr.aria-invalid]="invalid()"
    (change)="onPick($event)"
    (keydown.enter)="fieldSubmit.emit()"
    (keydown.escape)="fieldEscape.emit()"
  />
</div>
<!-- @relation(GSSC-PLLR-129, GSSC-PLLR-130, scope=range_end, role=Implementation) -->
