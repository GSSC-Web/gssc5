<!-- @relation(GSSC-PLLR-126, GSSC-PLLR-127, scope=range_start, role=Implementation) -->
<button
  class="gssc-prompt-button-field mt-2 inline-flex min-w-0 items-center justify-center rounded-md border px-3 py-2 font-sans text-sm font-normal hover:bg-gssc-gray"
  [attr.type]="role() === 'submit' ? 'submit' : 'button'"
  [class.border-gssc-dark-green]="!invalid()"
  [class.border-red-500]="invalid()"
  [class.bg-gssc-white]="enabled() && !invalid()"
  [class.bg-gssc-gray]="!enabled()"
  [class.bg-red-50]="invalid()"
  [class.text-gssc-dark-green]="!invalid()"
  [class.text-red-500]="invalid()"
  [disabled]="!enabled()"
  (click)="onActivate()"
  (keydown.escape)="fieldEscape.emit()"
>
  <span class="gssc-prompt-button-field__label">{{ label() }}</span>
</button>
<!-- @relation(GSSC-PLLR-126, GSSC-PLLR-127, scope=range_end, role=Implementation) -->
