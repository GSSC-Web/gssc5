<!-- @relation(GSSC-PLLR-123, GSSC-PLLR-124, scope=range_start, role=Implementation) -->
<fieldset
  class="gssc-prompt-options-field relative mt-2 min-w-0 rounded-md border px-2 pb-2 pt-3 font-sans"
  [class.border-gssc-dark-green]="!invalid()"
  [class.border-gssc-dark-red]="invalid()"
  [class.bg-gssc-white]="enabled() && !invalid()"
  [class.bg-gssc-gray]="!enabled()"
  [class.bg-gssc-light-red]="invalid()"
  [disabled]="!enabled()"
>
  <legend
    class="gssc-prompt-options-field__label px-1 text-xs font-extralight italic"
    [class.text-gssc-dark-green]="!invalid()"
    [class.text-gssc-dark-red]="invalid()"
  >
    {{ label() }}@if (required()) {
      <span aria-hidden="true">&nbsp;*</span>
    }
  </legend>
  <div class="flex flex-col gap-1.5">
    @for (choice of choices(); track choice.value) {
      <label
        class="gssc-prompt-options-field__choice flex items-center gap-2 text-sm font-normal"
        [class.text-gssc-dark-green]="!invalid()"
        [class.text-gssc-dark-red]="invalid()"
      >
        <input
          class="gssc-prompt-options-field__radio"
          type="radio"
          [name]="groupName()"
          [value]="choice.value"
          [checked]="value() === choice.value"
          [disabled]="!enabled()"
          (change)="select(choice.value)"
          (keydown.enter)="fieldSubmit.emit()"
          (keydown.escape)="fieldEscape.emit()"
        />
        <span>{{ choice.label }}</span>
      </label>
    }
  </div>
</fieldset>
<!-- @relation(GSSC-PLLR-123, GSSC-PLLR-124, scope=range_end, role=Implementation) -->
