<!-- @relation(GSSC-PLLR-132, GSSC-PLLR-133, scope=range_start, role=Implementation) -->
<div
  class="gssc-prompt-options-list-field relative mt-2 flex min-w-0 flex-col rounded-md border px-1 py-1 font-sans"
  [class.border-gssc-dark-green]="!invalid()"
  [class.border-gssc-dark-red]="invalid()"
  [class.bg-gssc-white]="enabled() && !invalid()"
  [class.bg-gssc-gray]="!enabled()"
  [class.bg-gssc-light-red]="invalid()"
>
  <label
    class="gssc-prompt-options-list-field__label absolute -top-2 start-2 bg-inherit px-1 text-xs font-extralight italic"
    [class.text-gssc-dark-green]="!invalid()"
    [class.text-gssc-dark-red]="invalid()"
    [attr.for]="controlId()"
  >
    {{ label() }}@if (required()) {
      <span aria-hidden="true">&nbsp;*</span>
    }
  </label>
  <select
    class="gssc-prompt-options-list-field__control w-full border-0 bg-transparent py-2 font-sans outline-none"
    [class.text-gssc-dark-green]="!invalid()"
    [class.text-gssc-dark-red]="invalid()"
    [id]="controlId()"
    [disabled]="!enabled()"
    [attr.aria-invalid]="invalid()"
    [value]="value()"
    (change)="onSelect($any($event.target).value)"
    (keydown.enter)="fieldSubmit.emit()"
    (keydown.escape)="fieldEscape.emit()"
  >
    <option value="" disabled [selected]="!value()">Select…</option>
    @for (choice of choices(); track choice.value) {
      <option [value]="choice.value" [selected]="value() === choice.value">
        {{ choice.label }}
      </option>
    }
  </select>
</div>
<!-- @relation(GSSC-PLLR-132, GSSC-PLLR-133, scope=range_end, role=Implementation) -->
