<!-- @relation(GSSC-PLLR-83, GSSC-PLLR-84, scope=range_start, role=Implementation) -->
<!-- @relation(GSSC-PLLR-85, scope=range_start, role=Implementation) -->
<section
  class="gssc-section flex w-full flex-col gap-4 border border-gssc-gray bg-gssc-white px-4 py-5 font-sans text-gssc-dark-green"
>
  <!-- @relation(GSSC-PLLR-85, scope=range_end, role=Implementation) -->

  @if (hasHeader(contents())) {
    <!-- @relation(GSSC-PLLR-86, GSSC-PLLR-87, GSSC-PLLR-88, scope=range_start, role=Implementation) -->
    <h2 class="gssc-section__header m-0 text-[1.5em] font-semibold text-gssc-dark-green">
      {{ contents().header }}
    </h2>
    <!-- @relation(GSSC-PLLR-86, GSSC-PLLR-87, GSSC-PLLR-88, scope=range_end, role=Implementation) -->
  }

  <!-- @relation(GSSC-PLLR-89, GSSC-PLLR-90, GSSC-PLLR-91, scope=range_start, role=Implementation) -->
  <div class="gssc-section__body m-0 text-base font-normal text-gssc-black">
    {{ contents().body }}
  </div>
  <!-- @relation(GSSC-PLLR-89, GSSC-PLLR-90, GSSC-PLLR-91, scope=range_end, role=Implementation) -->

  @if (hasResources(contents())) {
    <!-- @relation(GSSC-PLLR-92, GSSC-PLLR-93, GSSC-PLLR-94, scope=range_start, role=Implementation) -->
    <div
      #resourcesHost
      class="gssc-section__resources flex w-full items-center gap-2"
      [attr.data-carousel]="isCarousel() ? 'true' : 'false'"
    >
      @if (isCarousel()) {
        <!-- @relation(GSSC-PLLR-141, GSSC-PLLR-142, scope=range_start, role=Implementation) -->
        <button
          type="button"
          class="gssc-section__resources-prev inline-flex size-8 shrink-0 cursor-pointer items-center justify-center rounded border-0 bg-transparent p-0 text-gssc-dark-green hover:bg-gssc-gray"
          aria-label="Previous resources"
          (click)="stepPrev()"
        >
          <i class="nf nf-md-chevron_left text-base leading-none" aria-hidden="true"></i>
        </button>
        <!-- @relation(GSSC-PLLR-141, GSSC-PLLR-142, scope=range_end, role=Implementation) -->
      }

      <div class="gssc-section__viewport min-w-0 flex-1 overflow-hidden">
        <div
          class="gssc-section__track flex w-full items-stretch justify-start gap-2 transition-transform duration-200 ease-[ease]"
        >
          @for (resource of visibleResources(); track $index + ':' + resource.href + resource.name) {
            <!-- @relation(GSSC-PLLR-137, GSSC-PLLR-138, GSSC-PLLR-139, scope=range_start, role=Implementation) -->
            <a
              class="gssc-section__resource inline-flex h-11 items-center justify-center border border-gssc-dark-green bg-gssc-white px-2 text-center font-normal text-gssc-dark-green no-underline hover:bg-gssc-gray in-data-[carousel=false]:w-[8.5rem] in-data-[carousel=false]:flex-none in-data-[carousel=true]:w-auto in-data-[carousel=true]:min-w-0 in-data-[carousel=true]:flex-1"
              [href]="resource.href"
              >{{ resource.name }}</a
            >
            <!-- @relation(GSSC-PLLR-137, GSSC-PLLR-138, GSSC-PLLR-139, scope=range_end, role=Implementation) -->
          }
        </div>
      </div>

      @if (isCarousel()) {
        <!-- @relation(GSSC-PLLR-144, GSSC-PLLR-145, scope=range_start, role=Implementation) -->
        <button
          type="button"
          class="gssc-section__resources-next inline-flex size-8 shrink-0 cursor-pointer items-center justify-center rounded border-0 bg-transparent p-0 text-gssc-dark-green hover:bg-gssc-gray"
          aria-label="Next resources"
          (click)="stepNext()"
        >
          <i class="nf nf-md-chevron_right text-base leading-none" aria-hidden="true"></i>
        </button>
        <!-- @relation(GSSC-PLLR-144, GSSC-PLLR-145, scope=range_end, role=Implementation) -->
      }
    </div>
    <!-- @relation(GSSC-PLLR-92, GSSC-PLLR-93, GSSC-PLLR-94, scope=range_end, role=Implementation) -->
  }
</section>
<!-- @relation(GSSC-PLLR-83, GSSC-PLLR-84, scope=range_end, role=Implementation) -->
