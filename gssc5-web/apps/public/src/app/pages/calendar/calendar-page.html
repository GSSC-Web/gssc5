<div
  class="gssc-calendar-page flex w-full flex-col gap-4 p-4 font-sans text-gssc-dark-green"
>
  @if (noticeCuids().length > 0) {
    <div class="gssc-calendar-page__notices flex w-full flex-col gap-4">
      @for (cuid of noticeCuids(); track cuid) {
        <gssc-section-from-cuid [cuid]="cuid" />
      }
    </div>
  }

  <gssc-calendar class="gssc-calendar-page__calendar w-full" />
</div>
