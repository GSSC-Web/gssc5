<!-- @relation(GSSC-PLLR-208, GSSC-PLLR-209, scope=range_start, role=Implementation) -->
<div
  class="gssc-newsletters-page flex w-full flex-col gap-6 bg-gssc-white p-4 font-sans text-gssc-dark-green"
>
  <!-- @relation(GSSC-PLLR-256, GSSC-PLLR-257, scope=range_start, role=Implementation) -->
  @if (introCuids().length > 0) {
    <div class="gssc-newsletters-intro flex w-full flex-col gap-4">
      @for (cuid of introCuids(); track cuid) {
        <gssc-section-from-cuid [cuid]="cuid" />
      }
    </div>
  }
  <!-- @relation(GSSC-PLLR-256, GSSC-PLLR-257, scope=range_end, role=Implementation) -->

  <form
    class="gssc-newsletters-form flex flex-col gap-4 border border-gssc-gray bg-gssc-white p-4 font-sans text-gssc-dark-green"
    aria-label="Newsletter selection"
    (submit)="$event.preventDefault()"
  >
    <!-- @relation(GSSC-PLLR-223, GSSC-PLLR-224, scope=range_start, role=Implementation) -->
    <fieldset
      class="gssc-newsletters-mode flex flex-wrap gap-3 border-0 p-0 font-sans text-gssc-dark-green"
      data-testid="newsletter-mode"
    >
      <legend class="gssc-newsletters-mode__legend mb-1 font-semibold">Selection mode</legend>
      <label
        class="gssc-newsletters-mode__option inline-flex cursor-pointer items-center gap-2 border border-gssc-gray px-2 py-1 font-sans text-gssc-dark-green"
      >
        <input
          type="radio"
          name="newsletter-mode"
          class="gssc-newsletters-mode__radio"
          [checked]="selectionMode() === 'volume-number'"
          (change)="setSelectionMode('volume-number')"
          data-testid="newsletter-mode-volume-number"
        />
        Volume / Number
      </label>
      <label
        class="gssc-newsletters-mode__option inline-flex cursor-pointer items-center gap-2 border border-gssc-gray px-2 py-1 font-sans text-gssc-dark-green"
      >
        <input
          type="radio"
          name="newsletter-mode"
          class="gssc-newsletters-mode__radio"
          [checked]="selectionMode() === 'month-year'"
          (change)="setSelectionMode('month-year')"
          data-testid="newsletter-mode-month-year"
        />
        Month / Year
      </label>
    </fieldset>
    <!-- @relation(GSSC-PLLR-223, GSSC-PLLR-224, scope=range_end, role=Implementation) -->

    <div class="gssc-newsletters-menus flex flex-wrap items-end gap-4">
      @if (selectionMode() === 'volume-number') {
        <!-- @relation(GSSC-PLLR-211, GSSC-PLLR-212, scope=range_start, role=Implementation) -->
        <label class="gssc-newsletters-volume flex min-w-40 flex-col gap-1 font-sans text-gssc-dark-green">
          <span class="gssc-newsletters-volume__label font-semibold">Volume</span>
          <select
            class="gssc-newsletters-volume__control border border-gssc-gray bg-gssc-white px-2 py-1 font-sans text-gssc-dark-green"
            [value]="selectedVolume() ?? ''"
            (change)="onVolumeChange($any($event.target).value)"
            data-testid="newsletter-volume"
          >
            @for (volume of volumes(); track volume) {
              <option [value]="volume">{{ volume }}</option>
            }
          </select>
        </label>
        <!-- @relation(GSSC-PLLR-211, GSSC-PLLR-212, scope=range_end, role=Implementation) -->

        <!-- @relation(GSSC-PLLR-214, GSSC-PLLR-215, scope=range_start, role=Implementation) -->
        <label class="gssc-newsletters-number flex min-w-40 flex-col gap-1 font-sans text-gssc-dark-green">
          <span class="gssc-newsletters-number__label font-semibold">Number</span>
          <select
            class="gssc-newsletters-number__control border border-gssc-gray bg-gssc-white px-2 py-1 font-sans text-gssc-dark-green"
            [value]="selectedNumber() ?? ''"
            (change)="onNumberChange($any($event.target).value)"
            data-testid="newsletter-number"
          >
            @for (number of numbers(); track number) {
              <option [value]="number">{{ number }}</option>
            }
          </select>
        </label>
        <!-- @relation(GSSC-PLLR-214, GSSC-PLLR-215, scope=range_end, role=Implementation) -->
      } @else {
        <!-- @relation(GSSC-PLLR-217, GSSC-PLLR-218, scope=range_start, role=Implementation) -->
        <label class="gssc-newsletters-month flex min-w-40 flex-col gap-1 font-sans text-gssc-dark-green">
          <span class="gssc-newsletters-month__label font-semibold">Month</span>
          <select
            class="gssc-newsletters-month__control border border-gssc-gray bg-gssc-white px-2 py-1 font-sans text-gssc-dark-green"
            [value]="selectedMonth() ?? ''"
            (change)="onMonthChange($any($event.target).value)"
            data-testid="newsletter-month"
          >
            @for (month of months(); track month) {
              <option [value]="month">{{ labelForMonth(month) }}</option>
            }
          </select>
        </label>
        <!-- @relation(GSSC-PLLR-217, GSSC-PLLR-218, scope=range_end, role=Implementation) -->

        <!-- @relation(GSSC-PLLR-220, GSSC-PLLR-221, scope=range_start, role=Implementation) -->
        <label class="gssc-newsletters-year flex min-w-40 flex-col gap-1 font-sans text-gssc-dark-green">
          <span class="gssc-newsletters-year__label font-semibold">Year</span>
          <select
            class="gssc-newsletters-year__control border border-gssc-gray bg-gssc-white px-2 py-1 font-sans text-gssc-dark-green"
            [value]="selectedYear() ?? ''"
            (change)="onYearChange($any($event.target).value)"
            data-testid="newsletter-year"
          >
            @for (year of years(); track year) {
              <option [value]="year">{{ year }}</option>
            }
          </select>
        </label>
        <!-- @relation(GSSC-PLLR-220, GSSC-PLLR-221, scope=range_end, role=Implementation) -->
      }
    </div>
  </form>

  <div class="gssc-newsletters-selected flex flex-col gap-3">
    <!-- @relation(GSSC-PLLR-252, GSSC-PLLR-253, GSSC-PLLR-254, scope=range_start, role=Implementation) -->
    @if (selectedFileUrl(); as fileUrl) {
      <a
        class="gssc-newsletters-download inline-flex w-fit cursor-pointer border border-gssc-dark-green bg-transparent px-3 py-1 font-sans text-gssc-dark-green hover:bg-gssc-gray"
        [href]="fileUrl"
        download
        data-testid="newsletter-download"
      >
        Download
      </a>
    }
    <!-- @relation(GSSC-PLLR-252, GSSC-PLLR-253, GSSC-PLLR-254, scope=range_end, role=Implementation) -->

    <!-- @relation(GSSC-PLLR-226, GSSC-PLLR-227, scope=range_start, role=Implementation) -->
    @if (previewSafeUrl(); as previewUrl) {
      <iframe
        class="gssc-newsletters-preview min-h-96 w-full border border-gssc-gray bg-gssc-white"
        [src]="previewUrl"
        title="Newsletter preview"
        data-testid="newsletter-preview"
      ></iframe>
    }
    <!-- @relation(GSSC-PLLR-226, GSSC-PLLR-227, scope=range_end, role=Implementation) -->
  </div>
</div>
<!-- @relation(GSSC-PLLR-208, GSSC-PLLR-209, scope=range_end, role=Implementation) -->
