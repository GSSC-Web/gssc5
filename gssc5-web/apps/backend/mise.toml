[tasks.serve]
description = "Start the Elysia development server"
run = "bun run dev"

[tasks.build]
description = "Bundle the backend for production"
depends = ["types"]
run = "bun run build"

[tasks.db-generate]
description = "Generate the Prisma client"
run = "bunx --bun prisma generate"

[tasks.types]
description = "Generate the TypeScript declarations the frontends import"
depends = ["db-generate"]
run = "bun run types"

[tasks.test]
description = "Run the backend tests"
depends = ["types"]
run = "bun run test"
