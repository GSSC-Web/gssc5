[tasks.serve]
description = "Start the Elysia development server (reloads on change)"
depends = ["types"]
run = "bun run dev"

[tasks.build]
description = "Bundle the backend for production"
depends = ["types"]
run = "bun run build"

[tasks.db-generate]
description = "Generate the Prisma client"
run = "bunx --bun prisma generate"

[tasks.types]
description = "Generate the TypeScript declarations the frontends import"
depends = ["db-generate"]
run = "bun run types"

[tasks.test]
description = "Run the backend tests once"
depends = ["types"]
run = "bun run test"

[tasks."test:watch"]
description = "Re-run the backend tests when files change"
depends = ["types"]
run = "bun test --watch"
