[tasks.serve]
description = "Start the member frontend"
depends = ["//apps/backend:types"]
run = "bun run start"

[tasks.build]
description = "Build the member frontend"
depends = ["//apps/backend:types"]
run = "bun run build"

[tasks.test]
description = "Run the member frontend tests"
depends = ["//apps/backend:types"]
run = "bun run test -- --watch=false"
