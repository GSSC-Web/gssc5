<!-- @relation(GSSC-MLLR-159, GSSC-MLLR-160, GSSC-MLLR-161, scope=range_start, role=Implementation) -->
<article class="gssc-contact-row flex w-full flex-col gap-1 font-sans text-gssc-dark-green">
  <!-- @relation(GSSC-MLLR-162, GSSC-MLLR-163, GSSC-MLLR-164, scope=range_start, role=Implementation) -->
  <h3 class="gssc-contact-row__name m-0 font-sans text-base font-semibold text-gssc-dark-green">
    {{ contents().displayName }}
  </h3>
  <!-- @relation(GSSC-MLLR-162, GSSC-MLLR-163, GSSC-MLLR-164, scope=range_end, role=Implementation) -->

  <!-- @relation(GSSC-MLLR-165, GSSC-MLLR-166, GSSC-MLLR-167, scope=range_start, role=Implementation) -->
  <ul class="gssc-contact-row__methods m-0 flex list-none flex-col gap-0.5 p-0 font-sans text-sm font-normal text-gssc-dark-green">
    @for (method of contents().methods; track method.label) {
      <li class="gssc-contact-row__method">
        @if (hasHref(method)) {
          <a
            class="gssc-contact-row__method-link font-sans font-normal text-gssc-dark-green underline-offset-2 hover:underline"
            [href]="method.href!"
          >
            {{ method.label }}
          </a>
        } @else {
          <span class="gssc-contact-row__method-text font-sans font-normal text-gssc-dark-green">
            {{ method.label }}
          </span>
        }
      </li>
    }
  </ul>
  <!-- @relation(GSSC-MLLR-165, GSSC-MLLR-166, GSSC-MLLR-167, scope=range_end, role=Implementation) -->
</article>
<!-- @relation(GSSC-MLLR-159, GSSC-MLLR-160, GSSC-MLLR-161, scope=range_end, role=Implementation) -->
