<!-- @relation(GSSC-MLLR-177, GSSC-MLLR-178, GSSC-MLLR-179, scope=range_start, role=Implementation) -->
<ul class="gssc-form-password-criteria m-0 flex list-none flex-col gap-2 p-0 font-sans text-sm">
  @for (rule of criteria(); track rule.id) {
    <li
      class="gssc-form-password-criteria__rule flex items-center gap-2"
      [attr.data-criterion]="rule.id"
      [class.text-gssc-dark-green]="rule.satisfied"
      [class.text-gssc-dark-red]="!rule.satisfied"
    >
      <i
        class="nf gssc-form-password-criteria__icon"
        [class.nf-fa-check]="rule.satisfied"
        [class.nf-fa-times]="!rule.satisfied"
        aria-hidden="true"
      ></i>
      <span class="gssc-form-password-criteria__label">{{ rule.label }}</span>
    </li>
  }
</ul>
<!-- @relation(GSSC-MLLR-177, GSSC-MLLR-178, GSSC-MLLR-179, scope=range_end, role=Implementation) -->
