<!-- @relation(GSSC-MLLR-291, GSSC-MLLR-292, GSSC-MLLR-293, scope=range_start, role=Implementation) -->
<section
  class="gssc-announcements-editor-page mx-auto flex w-full max-w-3xl flex-col gap-4 bg-gssc-white font-sans"
>
  <h1 class="gssc-announcements-editor-page__title m-0 text-2xl font-medium text-gssc-dark-green sm:text-3xl">
    Announcements
  </h1>

  <!-- @relation(GSSC-MLLR-294, GSSC-MLLR-295, GSSC-MLLR-296, scope=range_start, role=Implementation) -->
  <div
    class="gssc-announcement-catalog flex w-full flex-col gap-2 border border-gssc-gray px-3 py-3 font-sans text-gssc-dark-green"
  >
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 class="gssc-announcement-catalog__heading m-0 text-lg font-semibold text-gssc-dark-green">
        Catalog
      </h2>
      <button
        type="button"
        class="gssc-announcement-catalog__create inline-flex cursor-pointer items-center justify-center rounded-md border border-gssc-dark-green bg-gssc-light-green px-3 py-1.5 font-sans text-sm text-gssc-dark-green hover:bg-gssc-gray"
        (click)="startCreate()"
      >
        New announcement
      </button>
    </div>

    <ul
      class="gssc-announcement-catalog__list m-0 max-h-40 list-none overflow-y-auto p-0"
      role="list"
    >
      @for (row of catalog(); track row.cuid) {
        <li>
          <button
            type="button"
            class="gssc-announcement-catalog__item w-full cursor-pointer border-0 px-2 py-2 text-start font-sans text-sm text-gssc-dark-green hover:bg-gssc-light-green"
            [class.bg-gssc-light-green]="selectedCuid() === row.cuid"
            (click)="selectAnnouncement(row.cuid)"
          >
            {{ catalogLabel(row) }}
          </button>
        </li>
      } @empty {
        <li class="gssc-announcement-catalog__empty px-2 py-2 font-sans text-sm text-gssc-dark-brown">
          No announcements yet.
        </li>
      }
    </ul>
  </div>
  <!-- @relation(GSSC-MLLR-294, GSSC-MLLR-295, GSSC-MLLR-296, scope=range_end, role=Implementation) -->

  @if (showEditor()) {
    <!-- @relation(GSSC-MLLR-297, GSSC-MLLR-298, GSSC-MLLR-299, scope=range_start, role=Implementation) -->
    <div class="gssc-announcement-editor w-full">
      <gssc-editor
        [resourceId]="editorResourceId()"
        [permitted]="fieldsEnabled()"
        [title]="editorTitle()"
        (saved)="onEditorSaved()"
        (cancelled)="onEditorCancelled()"
      >
        @if (mode() === 'create') {
          <gssc-form-select-field
            label="Content Template"
            [options]="templateOptions()"
            [value]="templateId()"
            [required]="true"
            [enabled]="fieldsEnabled()"
            (valueChange)="onTemplateChange($event)"
          />
        }
        <gssc-form-text-field
          label="Header"
          [(value)]="header"
          [enabled]="fieldsEnabled()"
        />
        <gssc-form-text-field
          label="Body"
          [(value)]="body"
          [required]="true"
          [enabled]="fieldsEnabled()"
        />
        <gssc-form-select-field
          label="Publication Target"
          [options]="activePublicationOptions()"
          [(value)]="publication"
          [enabled]="fieldsEnabled()"
        />
      </gssc-editor>
    </div>
    <!-- @relation(GSSC-MLLR-297, GSSC-MLLR-298, GSSC-MLLR-299, scope=range_end, role=Implementation) -->
  }

  <p
    class="gssc-announcements-editor-page__status m-0 font-sans text-sm text-gssc-dark-brown"
    data-slot="announcements-editor-status"
    role="status"
  >
    {{ statusMessage() }}
  </p>
</section>
<!-- @relation(GSSC-MLLR-291, GSSC-MLLR-292, GSSC-MLLR-293, scope=range_end, role=Implementation) -->
