<!-- @relation(GSSC-MLLR-231, GSSC-MLLR-232, GSSC-MLLR-233, scope=range_start, role=Implementation) -->
<div class="gssc-dashboard-page flex w-full flex-col gap-4 p-4 font-sans text-gssc-dark-green">
  <!-- @relation(GSSC-MLLR-234, GSSC-MLLR-235, GSSC-MLLR-236, scope=range_start, role=Implementation) -->
  @if (sectionViews().length > 0) {
    <div class="gssc-dashboard-page__sections flex w-full flex-col gap-4">
      @for (view of sectionViews(); track view.viewKey) {
        <div class="gssc-dashboard-page__section flex w-full flex-col gap-3">
          <gssc-section-from-cuid [cuid]="view.cuid" />

          <!-- @relation(GSSC-MLLR-237, GSSC-MLLR-238, GSSC-MLLR-239, scope=range_start, role=Implementation) -->
          @if (canModify()) {
            <gssc-dashboard-section-editor
              [cuid]="view.cuid"
              (saved)="onSectionSaved(view.cuid)"
              (failed)="onSectionSaveFailed()"
              (cancelled)="onSectionCancelled()"
            />
          }
          <!-- @relation(GSSC-MLLR-237, GSSC-MLLR-238, GSSC-MLLR-239, scope=range_end, role=Implementation) -->
        </div>
      }
    </div>
  }
  <!-- @relation(GSSC-MLLR-234, GSSC-MLLR-235, GSSC-MLLR-236, scope=range_end, role=Implementation) -->

  @if (saveStatus()) {
    <p class="m-0 text-sm text-gssc-dark-brown" data-slot="dashboard-save-status">
      {{ saveStatus() }}
    </p>
  }
</div>
<!-- @relation(GSSC-MLLR-231, GSSC-MLLR-232, GSSC-MLLR-233, scope=range_end, role=Implementation) -->
