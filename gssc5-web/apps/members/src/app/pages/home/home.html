<section class="mx-auto flex w-full max-w-3xl flex-col gap-3">
  <h1 class="text-2xl font-medium text-gssc-dark-green sm:text-3xl">Members area</h1>
  <p class="text-sm text-gssc-dark-brown sm:text-base">
    Signed-in members use this app. Session comes from the Login Token cookie.
  </p>
  <p class="text-sm text-gssc-black" data-slot="backend-status">{{ backendMessage() }}</p>
  <gssc-section [contents]="demoContents" />

  <gssc-editor
    resourceId="home-editor-demo"
    title="Generic editor preview"
    (saved)="onEditorSaved()"
    (cancelled)="onEditorCancelled()"
  >
    <gssc-form-text-field label="Header" [(value)]="editorHeader" />
    <gssc-form-text-field label="Body" [(value)]="editorBody" />
    <gssc-form-select-field
      label="Image Position"
      [options]="imagePositionOptions"
      [(value)]="editorImagePosition"
    />
  </gssc-editor>
  <p class="text-sm text-gssc-dark-brown" data-slot="editor-status">{{ editorStatus() }}</p>
</section>
