name: Test

on:
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: gssc5-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Do not search above the repo root for mise config.
      MISE_CEILING_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Bun and Node
        uses: jdx/mise-action@v5
        with:
          # Single monorepo root: repo-root mise.toml declares bun/node and
          # [tasks.test]. experimental is required for monorepo_root.
          working_directory: ${{ github.workspace }}
          experimental: true
          install_args: bun node

      - name: Install dependencies
        working-directory: gssc5-web
        run: mise exec -- bun install --frozen-lockfile

      - name: Run tests
        run: mise test
