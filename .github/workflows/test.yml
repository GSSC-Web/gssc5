name: Test

on:
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: gssc5-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Ceiling directories are not searched. Stop at the checkout's parent so
      # repo-root mise.toml still loads when a step runs under gssc5-web.
      MISE_CEILING_PATHS: ${{ github.workspace }}/..
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Bun and Node
        uses: jdx/mise-action@v5
        with:
          # Single monorepo root: repo-root mise.toml declares bun/node and
          # [tasks.test]. experimental is required for monorepo_root.
          working_directory: ${{ github.workspace }}
          experimental: true
          install_args: bun node

      - name: Install dependencies
        # Stay at repo root so mise resolves bun from root mise.toml; bun --cwd
        # targets the web workspace lockfile.
        run: mise exec -- bun install --frozen-lockfile --cwd=gssc5-web

      - name: Run tests
        run: mise test
