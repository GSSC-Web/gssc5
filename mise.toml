#:schema https://mise.jdx.dev/schema/mise.json
# GSSC5 Requirements mise config.

min_version = "2025.8.0"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[tools]
# StrictDoc requires Python >= 3.10.
python = "3.12"
uv = "latest"

# TODO: Isolated StrictDoc CLI (uv-backed pypi backend). Pin a release instead of
# "latest" once the project is stable, e.g. "0.30.1".
"pypi:strictdoc" = { version = "latest", depends = ["python", "uv"] }

[env]
# TODO: Optional local venv if you also want `pip install -e` / extra Python deps.
# Comment this block out if you only use the isolated pypi:strictdoc tool.
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install/upgrade StrictDoc in the project venv"
alias = "i"
run = "uv pip install --upgrade strictdoc"

[tasks.export]
description = "Export the project tree to static HTML"
alias = "e"
run = "strictdoc export ."

[tasks.server]
description = "Start the StrictDoc web server (http://127.0.0.1:5111)"
alias = "s"
run = "strictdoc server ."

[tasks.auto-uid]
description = "Assign missing requirement UIDs in-place"
run = "strictdoc manage auto-uid ."

[tasks.export-json]
description = "Export the project tree to JSON"
run = "strictdoc export . --formats=json"

[tasks.version]
description = "Print Python and StrictDoc versions"
run = [
  "python --version",
  "strictdoc --version",
]
